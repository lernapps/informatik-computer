# Aufgaben für die Übung „Welches Gerät passt?“. geraet ist die richtige Wahl, falschA und falschB sind die
# anderen Geräte mit ihrem Grund, warum sie weniger passen, grund begründet die richtige Wahl mit dem EVA-Bild.

- aufgabe:
    de: "Mia schreibt ein Referat über Igel, zwei Seiten Text."
    en: "Mia writes a talk about hedgehogs, two pages of text."
  geraet: "Laptop"
  falschA: "Smartwatch"
  grundA:
    de: "Auf der Smartwatch kannst du kaum tippen, und der Bildschirm ist winzig."
    en: "On a smartwatch you can hardly type, and the screen is tiny."
  falschB: "Smartphone"
  grundB:
    de: "Auf dem Smartphone kannst du tippen, aber zwei Seiten Text sind dort mühsam. Der Bildschirm ist klein."
    en: "On a smartphone you can type, but two pages of text are hard work there. The screen is small."
  grund:
    de: "Für viel Text brauchst du eine Tastatur zur Eingabe und einen großen Bildschirm zur Ausgabe. Das hat der Laptop."
    en: "For a lot of text you need a keyboard for input and a big screen for output. The laptop has both."
- aufgabe:
    de: "Jona will beim Wandertag Fotos machen und sie gleich ansehen."
    en: "Jona wants to take photos on the class hike and look at them straight away."
  geraet: "Smartphone"
  falschA: "Laptop"
  grundA:
    de: "Der Laptop ist schwer zum Mitnehmen, und seine Kamera ist für Fotos von dir selbst am Bildschirm gedacht."
    en: "The laptop is heavy to carry, and its camera is meant for pictures of you at the screen."
  falschB: "Smartwatch"
  grundB:
    de: "Die meisten Smartwatches haben keine Kamera. Ohne Eingabegerät für Bilder gibt es keine Fotos."
    en: "Most smartwatches have no camera. Without an input device for pictures there are no photos."
  grund:
    de: "Fotos brauchen eine Kamera zur Eingabe und einen Bildschirm zur Ausgabe, und das Gerät muss in die Tasche passen. Das kann das Smartphone."
    en: "Photos need a camera for input and a screen for output, and the device has to fit in a pocket. The smartphone can do that."
- aufgabe:
    de: "Selin will beim Joggen ihre Schritte zählen, ohne etwas in der Hand zu halten."
    en: "Selin wants to count her steps while jogging, without holding anything in her hand."
  geraet: "Smartwatch"
  falschA: "Smartphone"
  grundA:
    de: "Das Smartphone kann Schritte zählen, aber Selin müsste es in der Hand oder Tasche tragen."
    en: "The smartphone can count steps, but Selin would have to carry it in her hand or pocket."
  falschB: "Laptop"
  grundB:
    de: "Mit einem Laptop kann man nicht joggen."
    en: "You cannot go jogging with a laptop."
  grund:
    de: "Die Smartwatch sitzt am Arm. Sie merkt die Bewegung (Eingabe) und zeigt die Schritte (Ausgabe), ohne dass Selin etwas hält."
    en: "The smartwatch sits on the wrist. It notices the movement (input) and shows the steps (output) without Selin holding anything."
- aufgabe:
    de: "Mia will auf dem Fahrrad die Uhrzeit sehen, ohne anzuhalten."
    en: "Mia wants to see the time on her bike without stopping."
  geraet: "Smartwatch"
  falschA: "Smartphone"
  grundA:
    de: "Das Smartphone müsste Mia erst aus der Tasche holen. Dafür müsste sie anhalten."
    en: "Mia would first have to take the smartphone out of her pocket. She would have to stop for that."
  falschB: "Laptop"
  grundB:
    de: "Einen Laptop kann man beim Radfahren nicht ansehen."
    en: "You cannot look at a laptop while cycling."
  grund:
    de: "Die Smartwatch zeigt die Uhrzeit am Arm. Ein kurzer Blick reicht."
    en: "The smartwatch shows the time on the wrist. A quick look is enough."
- aufgabe:
    de: "Jona tippt eine Liste mit allen 28 Namen der Klasse für den Ausflug."
    en: "Jona types a list of all 28 names in the class for the trip."
  geraet: "Laptop"
  falschA: "Smartwatch"
  grundA:
    de: "Auf der Smartwatch kann man keine lange Liste tippen."
    en: "You cannot type a long list on a smartwatch."
  falschB: "Smartphone"
  grundB:
    de: "Auf dem Smartphone geht das, aber 28 Namen auf dem kleinen Bildschirm zu tippen dauert lange."
    en: "It works on a smartphone, but typing 28 names on the small screen takes a long time."
  grund:
    de: "Für lange Listen ist eine Tastatur zur Eingabe am besten. Das hat der Laptop."
    en: "For long lists a keyboard is best for input. The laptop has one."
- aufgabe:
    de: "Selin filmt beim Schulfest ein kurzes Video vom Tanz."
    en: "Selin films a short video of the dance at the school fair."
  geraet: "Smartphone"
  falschA: "Smartwatch"
  grundA:
    de: "Die meisten Smartwatches haben keine Kamera."
    en: "Most smartwatches have no camera."
  falschB: "Laptop"
  grundB:
    de: "Den Laptop müsste Selin hochhalten, und er filmt nur in eine Richtung, zu ihr hin."
    en: "Selin would have to hold the laptop up, and it only films in one direction, towards her."
  grund:
    de: "Ein Video braucht Kamera und Mikrofon zur Eingabe. Das Smartphone hat beides und lässt sich gut halten."
    en: "A video needs a camera and a microphone for input. The smartphone has both and is easy to hold."
