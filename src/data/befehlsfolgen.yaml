# Befehlsfolgen für die Übung „Wie viele Sonnen?“. Am Anfang ist eine Sonne auf dem Bild und markiert; was
# eingefügt wird, ist danach markiert; Ausschneiden nimmt die markierte Sonne weg. sonnen ist die richtige Zahl,
# Ausschneiden folgt nie auf Ausschneiden (danach ist nichts markiert). fehlerKopieren die Zahl, wenn man glaubt, Kopieren füge schon ein, fehlerAusschneiden die Zahl, wenn man glaubt,
# Ausschneiden lasse die Sonne stehen. Beide Fehler sind immer verschieden von sonnen.

- folge:
    de: "Kopieren, Einfügen, Kopieren, Einfügen, Ausschneiden"
    en: "copy, paste, copy, paste, cut"
  sonnen: 2
  fehlerKopieren: 4
  fehlerAusschneiden: 3
- folge:
    de: "Kopieren, Kopieren, Einfügen, Ausschneiden, Einfügen"
    en: "copy, copy, paste, cut, paste"
  sonnen: 2
  fehlerKopieren: 4
  fehlerAusschneiden: 3
- folge:
    de: "Ausschneiden, Einfügen, Ausschneiden, Einfügen, Kopieren, Einfügen"
    en: "cut, paste, cut, paste, copy, paste"
  sonnen: 2
  fehlerKopieren: 3
  fehlerAusschneiden: 4
- folge:
    de: "Kopieren, Einfügen, Einfügen, Ausschneiden, Einfügen, Ausschneiden"
    en: "copy, paste, paste, cut, paste, cut"
  sonnen: 2
  fehlerKopieren: 3
  fehlerAusschneiden: 4
- folge:
    de: "Ausschneiden, Einfügen, Einfügen, Kopieren, Kopieren, Einfügen"
    en: "cut, paste, paste, copy, copy, paste"
  sonnen: 3
  fehlerKopieren: 5
  fehlerAusschneiden: 4
