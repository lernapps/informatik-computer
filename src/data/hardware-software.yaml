# Hardware oder Software? art ist die richtige Wahl, gegenteil die falsche, grund sagt warum.

- name:
    de: "Tastatur"
    en: "keyboard"
  art: "Hardware"
  gegenteil: "Software"
  grund:
    de: "Die Tastatur kannst du anfassen und drücken."
    en: "You can touch and press the keyboard."
- name:
    de: "Bildschirm"
    en: "screen"
  art: "Hardware"
  gegenteil: "Software"
  grund:
    de: "Den Bildschirm kannst du anfassen. Er zeigt Software an, ist aber selbst ein Teil zum Anfassen."
    en: "You can touch the screen. It shows software, but is itself a part you can touch."
- name:
    de: "Kopfhörer"
    en: "headphones"
  art: "Hardware"
  gegenteil: "Software"
  grund:
    de: "Kopfhörer kannst du anfassen und aufsetzen."
    en: "You can touch headphones and put them on."
- name:
    de: "Maus"
    en: "mouse"
  art: "Hardware"
  gegenteil: "Software"
  grund:
    de: "Die Maus kannst du anfassen und bewegen."
    en: "You can touch the mouse and move it."
- name:
    de: "Akku"
    en: "battery"
  art: "Hardware"
  gegenteil: "Software"
  grund:
    de: "Den Akku kannst du anfassen, wenn man das Gerät öffnet."
    en: "You can touch the battery when the device is opened."
- name:
    de: "Drucker"
    en: "printer"
  art: "Hardware"
  gegenteil: "Software"
  grund:
    de: "Den Drucker kannst du anfassen."
    en: "You can touch the printer."
- name:
    de: "Mal-App"
    en: "drawing app"
  art: "Software"
  gegenteil: "Hardware"
  grund:
    de: "Die Mal-App ist ein Programm. Du siehst sie auf dem Bildschirm, aber anfassen kannst du sie nicht."
    en: "The drawing app is a program. You see it on the screen, but you cannot touch it."
- name:
    de: "Spiel auf der Konsole"
    en: "game on the console"
  art: "Software"
  gegenteil: "Hardware"
  grund:
    de: "Das Spiel ist ein Programm. Auch wenn es auf einer Karte geliefert wird: Das Spiel selbst kannst du nicht anfassen."
    en: "The game is a program. Even if it comes on a card: you cannot touch the game itself."
- name:
    de: "Taschenrechner-App"
    en: "calculator app"
  art: "Software"
  gegenteil: "Hardware"
  grund:
    de: "Die Taschenrechner-App ist ein Programm. Sie läuft auf dem Gerät, anfassen kannst du sie nicht."
    en: "The calculator app is a program. It runs on the device, you cannot touch it."
- name:
    de: "Lern-App"
    en: "learning app"
  art: "Software"
  gegenteil: "Hardware"
  grund:
    de: "Die Lern-App ist ein Programm. Du kannst sie benutzen, aber nicht anfassen."
    en: "The learning app is a program. You can use it, but you cannot touch it."
- name:
    de: "Wetter-App"
    en: "weather app"
  art: "Software"
  gegenteil: "Hardware"
  grund:
    de: "Die Wetter-App ist ein Programm. Anfassen kannst du nur das Gerät, auf dem sie läuft."
    en: "The weather app is a program. You can only touch the device it runs on."
