# Gegenstände für die Übung „Informatiksystem oder nicht?“. antwort ist ja oder nein, gegenteil die falsche Wahl,
# grund sagt warum, ohne die Antwort vorwegzunehmen.

- name:
    de: "Smartphone"
    en: "smartphone"
  antwort:
    de: "ja"
    en: "yes"
  gegenteil:
    de: "nein"
    en: "no"
  grund:
    de: "Im Smartphone arbeitet ein kleiner Computer mit vielen Programmen, den Apps."
    en: "A small computer with many programs, the apps, works inside a smartphone."
- name:
    de: "Spielkonsole"
