# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: informatik/informatiksysteme
title:
  de: Wie ein Computer arbeitet
  en: How a computer works
intro:
  de: >-
    Die Computer-AG zeigt die Ausstellung „Der gläserne Computer“. Jona und Selin aus der Klasse 6b, beide 11, zeigen dir die Stationen. Später kommt ihre Mitschülerin Mia zu Besuch.
    Du findest Informatiksysteme in deinem Alltag, schaust in einen Computer hinein und lernst das EVA-Prinzip:
    Eingabe, Verarbeitung, Ausgabe.
  en: >-
    The computer club is showing the exhibition “The glass computer”. Jona and Selin from class 6b, both 11, show you the stations. Later their classmate Mia comes to visit.
    You find computer systems in your everyday life, look inside a computer and learn the IPO model: input, process,
    output.
languages: [de, en]
chapters: [alltag, innen]
