title:
  de: Wie ein Computer arbeitet
  en: How a computer works
intro:
  de: >-
    Die Computer-AG zeigt die Ausstellung „Der gläserne Computer“. Jona und Selin führen dich durch die Stationen.
    Du findest Informatiksysteme in deinem Alltag, schaust in einen Computer hinein und lernst das EVA-Prinzip:
    Eingabe, Verarbeitung, Ausgabe.
  en: >-
    The computer club is showing the exhibition “The glass computer”. Jona and Selin guide you through the stations.
    You find computer systems in your everyday life, look inside a computer and learn the IPO model: input, process,
    output.
