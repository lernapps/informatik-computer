<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" font-family="sans-serif" font-size="12">
  <title>Skizze: EVA-Bild mit Schublade und EvaSortierer bei 360 px</title>
  <text x="10" y="18" font-weight="bold">Bild eva-kaesten (S. 5 und 6)</text>
  <rect x="10" y="30" width="100" height="60" fill="none" stroke="#333"/><text x="60" y="64" text-anchor="middle">Eingabe</text>
  <path d="M112 60h14" stroke="#333" marker-end="url(#a)"/>
  <rect x="130" y="30" width="100" height="60" fill="none" stroke="#333"/><text x="180" y="52" text-anchor="middle">Verarbeitung</text>
  <text x="180" y="70" text-anchor="middle" font-size="10">Prozessor</text><text x="180" y="83" text-anchor="middle" font-size="10">Arbeitsspeicher</text>
  <path d="M232 60h14" stroke="#333" marker-end="url(#a)"/>
  <rect x="250" y="30" width="100" height="60" fill="none" stroke="#333"/><text x="300" y="64" text-anchor="middle">Ausgabe</text>
  <rect x="140" y="92" width="80" height="26" fill="none" stroke="#333" stroke-dasharray="4 2"/><text x="180" y="104" text-anchor="middle" font-size="10">Speicher – hebt auf</text><text x="180" y="115" text-anchor="middle" font-size="9">Festspeicher</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>
  <text x="10" y="150" font-weight="bold">EvaSortierer, Start: 5 Geräte, Kästen leer</text>
  <g font-size="11">
    <rect x="10" y="160" width="340" height="34" fill="none" stroke="#999"/><text x="16" y="181">Mikrofon</text>
    <rect x="120" y="166" width="70" height="22" fill="none" stroke="#333"/><text x="155" y="181" text-anchor="middle">Eingabe</text>
    <rect x="195" y="166" width="80" height="22" fill="none" stroke="#333"/><text x="235" y="181" text-anchor="middle">Verarbeitung</text>
    <rect x="280" y="166" width="65" height="22" fill="none" stroke="#333"/><text x="312" y="181" text-anchor="middle">Ausgabe</text>
    <text x="16" y="215">… je Gerät eine Zeile (Lautsprecher, Prozessor, Tastatur, Drucker)</text>
  </g>
  <text x="10" y="250" font-weight="bold">Nach dem Tippen: Gerät liegt im Kasten</text>
  <rect x="10" y="260" width="110" height="90" fill="none" stroke="#333"/><text x="16" y="276" font-weight="bold">Eingabe</text><text x="16" y="294">Mikrofon</text><text x="16" y="310">Tastatur</text>
  <rect x="125" y="260" width="110" height="90" fill="none" stroke="#333"/><text x="131" y="276" font-weight="bold">Verarbeitung</text><text x="131" y="294">Prozessor</text>
  <rect x="240" y="260" width="110" height="90" fill="none" stroke="#333"/><text x="246" y="276" font-weight="bold">Ausgabe</text><text x="246" y="294">Lautsprecher</text>
  <text x="10" y="372">Darunter „Prüfen“ (von der Runtime). Falsch: „Ein Drucker gibt</text>
  <text x="10" y="388">Papier mit Text aus – er gehört nicht zur Eingabe.“ Keine Lösung.</text>
  <text x="10" y="406">„Neue Aufgabe“ zieht andere Geräte. Zurücksetzen: eigene Zeile.</text>
</svg>
